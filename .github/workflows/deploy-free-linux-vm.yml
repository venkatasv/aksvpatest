name: Deploy Free Linux VM to Azure

on:
  workflow_dispatch:

# Define global variables here to prevent typos and region mismatches
env:
  RG_NAME: "rg-free-linux-india"
  LOCATION: "centralindia"
  VNET_NAME: "vnet-free-linux"
  SUBNET_NAME: "subnet-free-linux"
  NSG_NAME: "nsg-free-linux"
  PIP_NAME: "pip-free-linux"
  NIC_NAME: "nic-free-linux"
  VM_NAME: "vm-free-linux-01"

jobs:
  deploy-vm:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }}

      - name: Create virtual network and subnet
        run: |
          az network vnet create \
            --resource-group ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }} \
            --name ${{ env.VNET_NAME }} \
            --address-prefix 10.0.0.0/16 \
            --subnet-name ${{ env.SUBNET_NAME }} \
            --subnet-prefix 10.0.0.0/24

      - name: Create NSG and allow SSH
        run: |
          az network nsg create \
            --resource-group ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }} \
            --name ${{ env.NSG_NAME }}

          az network nsg rule create \
            --resource-group ${{ env.RG_NAME }} \
            --nsg-name ${{ env.NSG_NAME }} \
            --name AllowSSH \
            --priority 1000 \
            --source-address-prefixes '*' \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 22 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp

      - name: Create public IP
        run: |
          az network public-ip create \
            --resource-group ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }} \
            --name ${{ env.PIP_NAME }} \
            --sku Standard \
            --allocation-method Static

      - name: Create NIC
        run: |
          az network nic create \
            --resource-group ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }} \
            --name ${{ env.NIC_NAME }} \
            --vnet-name ${{ env.VNET_NAME }} \
            --subnet ${{ env.SUBNET_NAME }} \
            --network-security-group ${{ env.NSG_NAME }} \
            --public-ip-address ${{ env.PIP_NAME }}

      - name: Create Linux VM
        run: |
          az vm create \
            --resource-group ${{ env.RG_NAME }} \
            --location ${{ env.LOCATION }} \
            --name ${{ env.VM_NAME }} \
            --nics ${{ env.NIC_NAME }} \
            --image Ubuntu2204 \
            --size Standard_B2ats_v2 \
            --admin-username azureuser \
            --generate-ssh-keys

      - name: Get VM public IP
        run: |
          az vm show \
            --resource-group ${{ env.RG_NAME }} \
            --name ${{ env.VM_NAME }} \
            --show-details \
            --query publicIps \
            -o tsv
