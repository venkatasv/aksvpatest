apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres-vpa
  namespace: swagger-app
  labels:
    app: postgres
    managed-by: gitops
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgres
  updatePolicy:
    # Recommendation-only: Postgres restarts from Recreate mode are disruptive on 1 replica.
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        minAllowed:
          cpu: 15m
          memory: 48Mi
        maxAllowed:
          cpu: 400m
          memory: 512Mi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
