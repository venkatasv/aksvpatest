apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/venkatasv/aksvpatest.git'
    targetRevision: HEAD
    path: k8s/app-of-namespace # Change to k8s/namespace if you kept the k8s folder
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
