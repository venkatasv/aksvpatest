apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/venkatasv/aksvpatest.git
    targetRevision: add-aks-workflow
    path: k8s/namespace
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
