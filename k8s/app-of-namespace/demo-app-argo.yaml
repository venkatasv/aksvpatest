apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-deployment
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_USER/YOUR_REPO_NAME.git'
    targetRevision: HEAD
    path: appdeployment
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-app-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
